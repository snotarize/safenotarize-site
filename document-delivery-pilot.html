<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Your completed document | SafeNotarize test</title><style>body{margin:0;background:#f4f7fb;color:#092943;font:17px/1.5 system-ui}main{max-width:540px;margin:40px auto;padding:28px;background:white;border-radius:16px}button{padding:14px;background:#08783b;color:white;border:0;border-radius:8px;font:inherit;margin:8px 0;cursor:pointer}button:disabled{opacity:.5}a{color:#075da8}</style></head><body><main><a href="/">SafeNotarize</a><p>PRIVATE TEST — no real Stripe payment</p><h1>Your completed document</h1><p id="status" role="status" aria-live="polite">Checking document availability…</p><button id="check">Check again</button><button id="download" hidden>Download completed PDF</button><p>Links expire seven days after the completed document becomes available. Keep your link private.</p><p>Need help? Contact <a href="mailto:karl@safenotarize.com">karl@safenotarize.com</a> or 407-494-2083.</p></main><script>
(()=>{'use strict';const API='https://safenotarize-document-pilot.karlberryj.workers.dev';const status=document.getElementById('status'),check=document.getElementById('check'),download=document.getElementById('download');let token=location.hash.slice(1),order,busy=false;history.replaceState(null,'',location.pathname);try{order=JSON.parse(sessionStorage.getItem('sn-auth-order')||'null')}catch{}if(token&&!/^[a-f0-9]{64}$/.test(token)){status.textContent='This download link is invalid.';check.hidden=true;return}if(!token&&!/^[a-f0-9]{64}$/.test(order?.token||'')){status.textContent='Open the private link in your document email, or return in the browser where you authorized your card.';check.hidden=true;return}
function lock(v){busy=v;check.disabled=v;download.disabled=v}async function call(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(60000)});return r}
async function update(){if(busy)return;lock(true);try{if(token){status.textContent='Your private link is ready. Download to check availability.';download.hidden=false;return}const r=await call('/delivery/status',{order_token:order.token});const d=await r.json();if(r.ok&&d.status==='ready'){token=d.download_token;download.hidden=false;status.textContent='Your completed document is ready.'}else if(r.status===410)status.textContent='This download link has expired. Contact SafeNotarize.';else if(d.status==='review')status.textContent='Your document needs a manual check. Please contact SafeNotarize.';else if(d.error==='disabled')status.textContent='Document delivery setup is not enabled yet.';else status.textContent='Your document is not available yet. It becomes available after successful notarization and confirmed payment. Check again shortly.'}catch{status.textContent='We could not check your document. Please retry.'}finally{lock(false)}}
download.onclick=async()=>{if(busy||!token)return;lock(true);try{const r=await call('/delivery/download',{download_token:token});if(!r.ok){status.textContent=r.status===410?'This link has expired. Contact SafeNotarize.':'Your download is not available. Please retry or contact SafeNotarize.';return}if(!r.headers.get('Content-Type')?.includes('application/pdf'))throw Error('format');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SafeNotarize-completed-affidavit.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='Your download is ready. Check your browser downloads.'}catch{status.textContent='Download failed. Please retry.'}finally{lock(false)}};check.onclick=update;update()})();
</script></body></html>
