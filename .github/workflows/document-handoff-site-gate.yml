name: SafeNotarize Document Handoff Site Gate
on:
  push:
    branches:
      - feature/direct-pdf-to-airtable-documents-2026-11-06
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test site-tests/document-handoff.test.mjs
