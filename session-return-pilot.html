<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Session status | SafeNotarize</title><style>body{font:18px/1.6 system-ui;background:#f3f6fa;color:#123047;margin:0;padding:24px}main{max-width:560px;margin:60px auto;background:white;border-radius:18px;padding:32px}button{font:inherit;background:#087d49;color:white;padding:14px 22px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}a{color:#086b9d}</style></head><body><main><a href="https://safenotarize.com">SafeNotarize</a><p>Integration pilot</p><h1>Your session status</h1><p id="status" role="status" aria-live="polite">Checking your session…</p><button id="check">Check session status</button><p>This pilot checks notarization completion only. Payment and document delivery are not enabled here.</p><p>Need help? <a href="mailto:karl@safenotarize.com">Contact SafeNotarize</a>.</p></main><script>
(()=>{'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),button=document.getElementById('check');let busy=false;async function check(){if(busy)return;if(!/^[a-f0-9]{64}$/.test(token)){status.textContent='This link is incomplete. Contact SafeNotarize for help. Do not start a second session.';button.disabled=true;return}busy=true;button.disabled=true;try{const r=await fetch('https://safenotarize-document-pilot.karlberryj.workers.dev/completion/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_token:token}),signal:AbortSignal.timeout(25000)});const data=await r.json();if(!r.ok){status.textContent=data.error==='expired'?'This status link has expired. Contact SafeNotarize.':data.error==='disabled'?'Session checks are temporarily disabled. Contact SafeNotarize.':'We could not check your session. Please try again or contact SafeNotarize.';return}const messages={completed:'Your notarization is complete, confirmed by OneNotary. Payment and document delivery will be connected in the next update.',pending:'Your session is not yet confirmed complete. If you just finished, wait a moment and check again.',stopped:'This session has stopped or expired. Contact SafeNotarize for help.',review:'Your request needs a check. Contact SafeNotarize before starting another session.'};status.textContent=messages[data.status]||'Contact SafeNotarize for help.'}catch{status.textContent='We could not connect. Please try again.'}finally{busy=false;button.disabled=false}}button.addEventListener('click',check);check()})();
</script></body></html>
